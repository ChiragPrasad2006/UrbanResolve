services:
  - type: web
    name: civic-public-portal
    env: python
    buildCommand: "pip install -r requirements.txt"
    startCommand: "cd civic_system && uvicorn public_app.main:app --host 0.0.0.0 --port $PORT"
    plan: free
    envVars:
      - key: PYTHON_VERSION
        value: "3.11.0"
      - key: MONGO_DB_NAME
        value: "urbanresolve"
      - key: SMTP_HOST
        value: "smtp.gmail.com"
      - key: SMTP_PORT
        value: "587"
      - key: SMTP_USE_TLS
        value: "true"
      # These variables must be populated in the Render Dashboard
      - key: MONGO_URI
        sync: false
      - key: SMTP_USERNAME
        sync: false
      - key: SMTP_PASSWORD
        sync: false
      - key: SMTP_FROM_EMAIL
        sync: false
      - key: PUBLIC_BASE_URL
        sync: false
      - key: ESCALATION_EMAIL
        sync: false
      - key: ENCRYPTION_KEY
        sync: false
      - key: CSRF_SECRET
        sync: false
      - key: COOKIE_SECRET
        sync: false

  - type: web
    name: civic-admin-portal
    env: python
    buildCommand: "pip install -r requirements.txt"
    startCommand: "cd civic_system && uvicorn admin_app.main:app --host 0.0.0.0 --port $PORT"
    plan: free
    envVars:
      - key: PYTHON_VERSION
        value: "3.11.0"
      - key: MONGO_DB_NAME
        value: "urbanresolve"
      - key: SMTP_HOST
        value: "smtp.gmail.com"
      - key: SMTP_PORT
        value: "587"
      - key: SMTP_USE_TLS
        value: "true"
      # These variables must be populated in the Render Dashboard
      - key: MONGO_URI
        sync: false
      - key: SMTP_USERNAME
        sync: false
      - key: SMTP_PASSWORD
        sync: false
      - key: SMTP_FROM_EMAIL
        sync: false
      - key: PUBLIC_BASE_URL
        sync: false
      - key: ESCALATION_EMAIL
        sync: false
      - key: ENCRYPTION_KEY
        sync: false
      - key: CSRF_SECRET
        sync: false
      - key: COOKIE_SECRET
        sync: false
