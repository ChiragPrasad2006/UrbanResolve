{% extends "base.html" %}
{% block body_class %}auth-page{% endblock %}
{% block content %}

<h1>UrbanResolve Login</h1>
<p class="muted">Use your email to receive a secure OTP.</p>

<section class="auth-shell">
    {% if message %}
    <p class="success">{{ message }}</p>
    {% endif %}

    {% if error %}
    <p class="error">{{ error }}</p>
    {% endif %}

    <form
        class="form-card auth-card"
        action="{% if otp_requested %}/login/verify-otp{% else %}/login/request-otp{% endif %}"
        method="post"
    >
        <label>
            Email
            <input type="email" name="email" required value="{{ email or '' }}" autocomplete="email">
        </label>

        {% if otp_requested %}
        <label>
            Enter OTP
            <input type="text" name="otp" maxlength="6" inputmode="numeric" required autofocus>
        </label>
        {% endif %}

        <div class="form-actions auth-actions">
            <button class="btn-submit">
                {% if otp_requested %}Verify OTP{% else %}Send OTP{% endif %}
            </button>
        </div>
    </form>
</section>

{% endblock %}
