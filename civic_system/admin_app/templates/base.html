<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>UrbanResolve - Admin</title>
    <link rel="stylesheet" href="/static/styles.css">
    <link
        rel="stylesheet"
        href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css"
        integrity="sha256-p4NxAoJBhIIN+hmNHrzRCf9tD/miZyoHS5obTRR9BMY="
        crossorigin=""
    >
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    {% block extra_head %}{% endblock %}
</head>
<body class="{% block body_class %}{% endblock %}">

<header class="nav">
    <a href="/dashboard" class="logo">
        <span class="logo-mark">U</span>
        <span>UrbanResolve Admin</span>
    </a>
    <nav class="nav-right">
        <a href="/dashboard">Dashboard</a>
        {% if current_admin %}
            <span class="nav-user">{{ current_admin }}</span>
            <a href="/logout">Logout</a>
        {% else %}
            <a href="/login">Sign In</a>
        {% endif %}
    </nav>
</header>

<main class="container">
    {% block content %}{% endblock %}
</main>

<script
    src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"
    integrity="sha256-20nQCchB9co0qIjJZRGuk2/Z9VM+kNiyxNV1lvTlZBo="
    crossorigin=""
></script>
<script>
    // Replace Leaflet's broken default icon with a self-contained SVG pin.
    // This works on any host without needing external image files.
    const _svgMarkerHtml = `
        <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 36" width="28" height="42">
            <path d="M12 0C5.373 0 0 5.373 0 12c0 9 12 24 12 24S24 21 24 12C24 5.373 18.627 0 12 0z"
                fill="#3b82f6" stroke="#1d4ed8" stroke-width="1.5"/>
            <circle cx="12" cy="12" r="5" fill="white"/>
        </svg>`;
    window._urbanResolveMarkerIcon = L.divIcon({
        html: _svgMarkerHtml,
        className: '',
        iconSize: [28, 42],
        iconAnchor: [14, 42],
        popupAnchor: [0, -42]
    });
    const _svgAdminMarkerHtml = `
        <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 36" width="28" height="42">
            <path d="M12 0C5.373 0 0 5.373 0 12c0 9 12 24 12 24S24 21 24 12C24 5.373 18.627 0 12 0z"
                fill="#ef4444" stroke="#b91c1c" stroke-width="1.5"/>
            <circle cx="12" cy="12" r="5" fill="white"/>
        </svg>`;
    window._urbanResolveAdminMarkerIcon = L.divIcon({
        html: _svgAdminMarkerHtml,
        className: '',
        iconSize: [28, 42],
        iconAnchor: [14, 42],
        popupAnchor: [0, -42]
    });
</script>
{% block extra_scripts %}{% endblock %}
</body>
</html>
