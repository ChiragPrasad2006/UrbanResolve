{% extends "base.html" %}
{% block content %}

<h1>Admin Login</h1>
<p class="muted">Authorized personnel only.</p>

<section class="auth-grid">
    <form class="form-card" action="/login/request-otp" method="post">
        <input type="hidden" name="csrf_token" value="{{ csrf_token }}">
        <label>
            Admin Email
            <input type="email" name="email" required value="{{ email or '' }}">
        </label>
        <div class="form-actions">
            <button class="btn-submit">Send OTP</button>
        </div>
    </form>

    <form class="form-card" action="/login/verify-otp" method="post">
        <input type="hidden" name="csrf_token" value="{{ csrf_token }}">
        <label>
            Email
            <input type="email" name="email" required value="{{ email or '' }}">
        </label>

        <label>
            Enter OTP
            <input type="text" name="otp" maxlength="6" required>
        </label>

        <div class="form-actions">
            <button class="btn-submit">Verify OTP</button>
        </div>
    </form>
</section>

{% if message %}
<p class="success">{{ message }}</p>
{% endif %}

{% if error %}
<p class="error">{{ error }}</p>
{% endif %}

{% endblock %}
